name: Build exe (Windows 10 FSR 4 ML experiment)

# Builds veyra_qml_ui.exe from this branch and packages it together with the
# DirectX Agility SDK runtime. Drop the artifact's exe + agility\ folder into an
# existing Veyra 2.1.9 AMD portable package. Experimental, unofficial.

on:
  push:
    branches: ['win10-fsr4ml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 150
    env:
      AGILITY_VERSION: '1.620.2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: jurplel/install-qt-action@d325aaf2a8baeeda41ad0b5d39f84a6af9bcf005 # v4.3.0
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Restore vcpkg installed tree (FFmpeg and OpenSSL take ~30 min to build)
        id: vcpkgcache
        uses: actions/cache/restore@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-installed-ffmpeg-opus-datachannel-v2
          restore-keys: vcpkg-installed-ffmpeg-opus-datachannel-v1

      - name: vcpkg dependencies (FFmpeg, Opus, Xbox streaming stack)
        shell: pwsh
        run: |
          $vcpkg = "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe"
          # classic mode: must not run inside the repo (its vcpkg.json forces manifest mode)
          Set-Location $env:RUNNER_TEMP
          & $vcpkg install "ffmpeg[avcodec,avformat,swresample,swscale]:x64-windows" "opus:x64-windows" --recurse
          if ($LASTEXITCODE) { exit 1 }
          & $vcpkg install "libdatachannel[srtp,ws]:x64-windows-static" "nlohmann-json:x64-windows-static" --recurse
          if ($LASTEXITCODE) { exit 1 }

      - name: Save vcpkg installed tree right away (so later failures do not lose it)
        if: steps.vcpkgcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-installed-ffmpeg-opus-datachannel-v2

      - name: Public AMD SDK headers (FidelityFX SDK 2.3.0, AMF 1.5.3)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force third_party_local/amd | Out-Null
          git clone --depth 1 --branch v2.3.0 https://github.com/GPUOpen-LibrariesAndSDKs/FidelityFX-SDK.git third_party_local/amd/FidelityFX-SDK-2.3.0
          git clone --depth 1 --branch v1.5.3 https://github.com/GPUOpen-LibrariesAndSDKs/AMF.git third_party_local/amd/AMF-SDK-1.5.3
          # AMF keeps its public headers under amf/public/include
          if (Test-Path third_party_local/amd/AMF-SDK-1.5.3/amf/public/include) {
            New-Item -ItemType Junction -Path third_party_local/amd/AMF-SDK-1.5.3/include -Target (Resolve-Path third_party_local/amd/AMF-SDK-1.5.3/amf/public/include) | Out-Null
          }

      - name: FidelityFX SDK 1.1.4 sources (Veyra uses its optical flow on AMD)
        shell: pwsh
        run: |
          git clone --depth 1 --branch v1.1.4 https://github.com/GPUOpen-LibrariesAndSDKs/FidelityFX-SDK.git third_party_local/amd/FidelityFX-SDK

      - name: Restore built FidelityFX 1.1.4 libs
        id: ffx114cache
        uses: actions/cache/restore@v4
        with:
          path: third_party_local/amd/FidelityFX-SDK/sdk/bin
          key: ffx-sdk-1.1.4-dx12-x64-release-v1

      - name: Build FidelityFX SDK 1.1.4 libs (DX12 backend, Release)
        if: steps.ffx114cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force third_party_local/amd/FidelityFX-SDK/sdk/build | Out-Null
          Set-Location third_party_local/amd/FidelityFX-SDK/sdk/build
          cmake .. -G "Visual Studio 17 2022" -A x64 -DFFX_API_BACKEND=DX12_X64 -DFFX_ALL=ON -DFFX_AUTO_COMPILE_SHADERS=1
          if ($LASTEXITCODE) { exit 1 }
          cmake --build . --config Release --parallel 4
          if ($LASTEXITCODE) { exit 1 }
          Get-ChildItem ../bin/ffx_sdk/*.lib | Where-Object { $_.Name -match 'opticalflow|backend_dx12' } | Select-Object Name, Length
          if (-not (Test-Path ../bin/ffx_sdk/ffx_opticalflow_x64.lib)) { throw 'ffx_opticalflow_x64.lib was not produced' }

      - name: Save built FidelityFX 1.1.4 libs
        if: steps.ffx114cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: third_party_local/amd/FidelityFX-SDK/sdk/bin
          key: ffx-sdk-1.1.4-dx12-x64-release-v1

      - name: NVIDIA DLSS SDK headers (public repo; the engine includes nvsdk_ngx.h even in AMD builds)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force third_party_local/nvidia | Out-Null
          git clone --depth 1 --branch v310.7.0 https://github.com/NVIDIA/DLSS.git third_party_local/nvidia/DLSS-310.7.0
          Test-Path third_party_local/nvidia/DLSS-310.7.0/include/nvsdk_ngx.h

      - name: moonlight-common-c at the commit pinned in scripts/moonlight/dependency-lock.json
        shell: pwsh
        run: |
          $lock = Get-Content scripts/moonlight/dependency-lock.json -Raw | ConvertFrom-Json
          $m = $lock.moonlight_common_c
          New-Item -ItemType Directory -Force third_party_local/moonlight | Out-Null
          git clone $m.repository third_party_local/moonlight/moonlight-common-c
          git -C third_party_local/moonlight/moonlight-common-c checkout $m.commit
          git -C third_party_local/moonlight/moonlight-common-c submodule update --init --recursive
          foreach ($s in $m.submodules.PSObject.Properties) {
            $head = git -C third_party_local/moonlight/moonlight-common-c/$($s.Name) rev-parse HEAD
            "$($s.Name): have $head want $($s.Value.commit)"
          }

      - name: NVENC headers (public MIT headers from FFmpeg, n13.0.19.0)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force third_party_local/nvidia | Out-Null
          git clone --depth 1 --branch n13.0.19.0 https://github.com/FFmpeg/nv-codec-headers.git third_party_local/nvidia/nv-codec-headers-13.0
          Test-Path third_party_local/nvidia/nv-codec-headers-13.0/include/ffnvcodec/nvEncodeAPI.h

      - name: Configure
        shell: pwsh
        run: |
          $vc = ($env:VCPKG_INSTALLATION_ROOT -replace '\\','/') + '/installed'
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DVEYRA_BUILD_QML_UI=ON -DVEYRA_ENABLE_XBOX=ON -DVEYRA_ENABLE_D3D12_DEBUG=OFF -DVEYRA_ENABLE_DEINTERLACE=OFF -DVEYRA_ENABLE_EXPERIMENTAL_DLSSNR=ON -DVEYRA_ENABLE_MOONLIGHT=ON `
            "-DVEYRA_MOONLIGHT_SOURCE_DIR=$($PWD.Path -replace '\\','/')/third_party_local/moonlight/moonlight-common-c" `
            "-DVEYRA_FFMPEG_ROOT=$vc/x64-windows" `
            "-DVEYRA_DLSS_SDK_ROOT=$($PWD.Path -replace '\\','/')/third_party_local/nvidia/DLSS-310.7.0" `
            "-DCMAKE_PREFIX_PATH=$vc/x64-windows-static;$vc/x64-windows;$env:QT_ROOT_DIR"

      - name: Build veyra_qml_ui
        run: cmake --build build --target veyra_qml_ui --parallel 4

      - name: Package exe + Agility SDK runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/agility | Out-Null
          $exe = Get-ChildItem build -Recurse -Filter veyra_qml_ui.exe | Select-Object -First 1
          Copy-Item $exe.FullName dist/
          # the official exe links Opus statically; this build imports opus.dll, which the 2.1.9 package lacks
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/opus.dll" dist/
          Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/microsoft.direct3d.d3d12/$env:AGILITY_VERSION/microsoft.direct3d.d3d12.$env:AGILITY_VERSION.nupkg" -OutFile agility.zip
          Expand-Archive agility.zip agility_pkg
          Copy-Item agility_pkg/build/native/bin/x64/D3D12Core.dll dist/agility/
          $sig = Get-AuthenticodeSignature dist/agility/D3D12Core.dll
          if ($sig.Status -ne 'Valid') { throw "D3D12Core.dll signature: $($sig.Status)" }
          Get-ChildItem dist -Recurse | Select-Object FullName, Length

      - uses: actions/upload-artifact@v4
        with:
          name: veyra-win10-fsr4ml
          path: dist/
